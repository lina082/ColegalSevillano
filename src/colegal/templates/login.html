<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Colegal Sevillano — Acceso</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" type="image/x-icon">

    <!-- Tipografía -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to bottom right, #001f3f, #003366);
            color: white;
            font-family: 'Merriweather', serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.08);
            padding: 3rem 2.5rem;
            border-radius: 15px;
            width: 420px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
        }

        .login-title {
            text-align: center;
            margin-bottom: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .login-logo {
            display: block;
            margin: 0 auto 1rem auto;
            width: 85px;
            filter: drop-shadow(0px 0px 4px rgba(0,0,0,0.4));
        }

        .label {
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
            color: #f0f0f0;
        }

        .form-control {
            border-radius: 10px;
            height: 45px;
        }

        .btn-login {
            background-color: #b6862e;
            border: none;
            width: 100%;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 10px;
            margin-top: 1.2rem;
        }

        .btn-login:hover {
            background-color: #cc9a3f;
        }

        .error-box {
            background: rgba(140, 0, 0, 0.25);
            border-left: 4px solid #ff6961;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .footer-text {
            text-align: center;
            font-size: 0.8rem;
            margin-top: 1.8rem;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <img src="{{ url_for('static', path='logo.png') }}" class="login-logo" alt="Colegal Logo">

        <h3 class="login-title">Sistema Colegal Sevillano</h3>

        {% if error %}
        <div class="error-box">
            Contraseña incorrecta. Inténtelo nuevamente.
        </div>
        {% endif %}

           <form method="post" action="/login">
                <label class="label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>

                <button type="submit" class="btn-login">Ingresar</button>
            </form>


        <p class="footer-text">
            Acceso exclusivo — Uso interno.
        </p>
    </div>

</body>
</html>
