<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Colegal Sevillano — Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" type="image/x-icon">


    <style>
        body {
            background: linear-gradient(to right, #001f3f, #003366);
            color: #fff;
            font-family: 'Merriweather', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .welcome-box {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            font-size: 2.3rem;
            font-weight: 600;
        }
        p {
            font-size: 1.1rem;
            color: #dcdcdc;
        }
        .btn-main {
            background-color: #b6862e;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            margin: 0.5rem;
        }
        .btn-main:hover {
            background-color: #cc9a3f;
        }
        .assistant-box {
            background: rgba(255,255,255,0.08);
            border-radius: 15px;
            padding: 1.5rem;
            margin-top: 2rem;
            max-width: 420px;
        }
        .assistant-box h5 {
            color: #b6862e;
            font-weight: 600;
            margin-bottom: 0.7rem;
        }
    </style>
</head>
<body>
    <div class="welcome-box">
        <img src="{{ url_for('static', path='logo.png') }}" width="90" alt="Logo Colegal" class="mb-4">
        <h1>Bienvenido, Abogado Sevillano</h1>

        <p>Su tiempo vale más que redactar desde cero.  <strong>Precisión y Velocidad</strong>.</p>

        <div class="mt-4">
            <a href="/contrato" class="btn btn-main">
                <i class="bi bi-file-earmark-text"></i> Generar un nuevo contrato
            </a>
        </div>

        <div class="assistant-box mt-5">
            <h5><i class="bi bi-person-workspace"></i> Colegal Asistente</h5>
            <p>“Estaré aquí para asistirle en cada etapa del proceso de redacción y revisión. Estaré disponible 24/7”</p>
        </div>
    </div>
</body>
</html>
